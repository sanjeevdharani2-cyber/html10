
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Column Layout</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f1f5f9;
}

h1 {
  text-align: center;
  color: #2563eb;
}

.container {
  display: flex;
  gap: 15px;
  margin-top: 30px;
}

.column {
  flex: 1;
  padding: 30px;
  text-align: center;
  background: white;
  border-radius: 10px;
  box-shadow: 0 3px 10px #0002;
  min-height: 200px;
}

.column:nth-child(1) {
  background: #dbeafe;
}

.column:nth-child(2) {
  background: #dcfce7;
}

.column:nth-child(3) {
  background: #fce7f3;
}

@media (max-width: 600px) {
  .container {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<h1>HTML Three Column Layout</h1>

<div class="container">

  <div class="column">
    <h2>Column 1</h2>
    <p>First column content.</p>
  </div>

  <div class="column">
    <h2>Column 2</h2>
    <p>Second column content.</p>
  </div>

  <div class="column">
    <h2>Column 3</h2>
    <p>Third column content.</p>
  </div>

</div>

</body>
</html>
